<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silver Pet Food - Premium Pet Nutrition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- ✅ AOS Animation -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
  <link rel="icon" type="image/png" href="img/logo.png">

  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #FDF6E3; color: #211515; }
    .font-poppins { font-family: 'Poppins', sans-serif; }

    .hero-bg {
      background-color: #211515;
      color: #FDF6E3;
    }

    .dogker-logo {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 3.5rem;
      color: #FDF6E3;
      text-shadow: 1px 1px rgba(0,0,0,0.2);
    }

    .product-card-v2 {
      border-radius: 2.5rem;
      padding: 1.5rem;
      padding-top: 6rem;
      text-align: center;
      position: relative;
      margin-top: 5rem;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      will-change: transform;
      background-color: #ffffff;
      border: 1px solid #A1887F;
    }
    .product-card-v2:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 25px rgba(0,0,0,0.1);
    }

    .product-image-v2 {
      position: absolute;
      top: -5rem;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 10px 8px rgba(0,0,0,0.2));
    }

    .add-to-cart-btn {
      background-color: #E57A44;
      color: #FDF6E3;
      font-weight: bold;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      transition: background-color 0.3s ease;
      border: none;
      cursor: pointer;
    }
    .add-to-cart-btn:hover { background-color: #cf6735; }
  </style>

  <script src="/js/main.js"></script>
  <base href="../">
</head>
<body>
<header id="navbar-placeholder"></header>

<main>
  <section class="hero-bg pt-20 ">
    <img src="/img/ปรับขนาดป้าย/ปรับขนาด-AW-1920x800-px-_-ด๊อกเกอร์.jpg" alt="Silver 宠粮横幅 - DogKer">
  </section>

  <section class="py-20" data-aos="fade-up">
    <div class="w-full max-w-7xl mx-auto px-6">
      <div class="text-center mb-12">
        <h2 class="text-4xl font-bold">高端营养，健康加分</h2>
        <p class="mt-2">Silver 宠物食品严选优质原料，用心守护您的挚爱。</p>
      </div>

      <div class="flex flex-wrap justify-center gap-x-10 gap-y-24 mt-16">
        <div class="product-card-v2" data-aos="zoom-in-up" data-aos-delay="100">
          <img src="/img/dogker/dogkerรสเนื้อ.png" alt="DogKer 成犬犬粮——牛肉口味" class="product-image-v2">
          <h3 class="text-2xl font-bold mt-8">DogKer 成犬粮 · 牛肉口味</h3>
          <p class="mt-2 mb-6 h-12">适合 ≥1 岁成犬的干粮，牛肉口味，蛋白含量 18%。</p>
          <button class="add-to-cart-btn">加入购物车</button>
        </div>

        <div class="product-card-v2" data-aos="zoom-in-up" data-aos-delay="200">
          <img src="/img/dogker/dogkerรสตับ.png" alt="DogKer 成犬犬粮——肝味" class="product-image-v2">
          <h3 class="text-2xl font-bold mt-8">DogKer 成犬粮 · 肝味</h3>
          <p class="mt-2 mb-6 h-12">适合 ≥1 岁成犬的干粮，肝味，蛋白含量 18%。</p>
          <button class="add-to-cart-btn">加入购物车</button>
        </div>
      </div>
    </div>
  </section>
</main>


<div id="footer-placeholder"></div>

<!-- ✅ AOS Script -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ duration: 1000, once: true, offset: 120 });
</script>

</body>
</html>
