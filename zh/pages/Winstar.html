<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinStar Cat Food - WinStar Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- ✅ AOS Animation -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
  <link rel="icon" type="image/png" href="img/logo.png">

  <style>
    body { font-family: 'Kanit', sans-serif; }
    .font-poppins { font-family: 'Poppins', sans-serif; }
    .hero-bg {
      background-color: #fdd835;
      position: relative;
      overflow: hidden;
    }
    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg"><path fill="%23e53935" fill-opacity="1" d="M0,192L80,176C160,160,320,128,480,133.3C640,139,800,181,960,186.7C1120,192,1280,160,1360,144L1440,128L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path></svg>');
      background-repeat: no-repeat;
      background-size: cover;
    }
    .winstar-logo {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 3.5rem;
      color: #d32f2f;
      text-shadow: 2px 2px #fff, 4px 4px rgba(0,0,0,0.1);
    }

    .bg-pastel-blue { background-color: #ff9f9c; }
    .bg-pastel-pink { background-color: #a8d1ff; }
    .bg-pastel-peach { background-color: #fdcda5; }

    .product-card-v2 {
      border-radius: 2.5rem;
      padding: 1.5rem;
      padding-top: 6rem;
      text-align: center;
      position: relative;
      margin-top: 5rem;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      will-change: transform;
    }
    .product-card-v2:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 25px rgba(0,0,0,0.1);
    }
    .product-image-v2 {
      position: absolute;
      top: -5rem;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 10px 8px rgba(0,0,0,0.2));
    }
    .add-to-cart-btn {
      background-color: #2D3748;
      color: white;
      font-weight: bold;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      transition: background-color 0.3s ease;
      border: none;
      cursor: pointer;
    }
    .add-to-cart-btn:hover {
      background-color: #1A202C;
    }
  </style>

  <script src="/js/main.js"></script>
  <base href="../" />
</head>
<body class="bg-gray-50">
  <header id="navbar-placeholder"></header>

<main>
  <!-- Hero Section -->
  <section class="hero-bg pt-20" aria-label="WinStar 品牌主视觉">
    <img
      src="/img/ปรับขนาดป้าย/ปรับขนาด-AW-1920x800-px-_-วินสตาร์.jpg"
      alt="WinStar——高品质猫粮，猫咪一吃就爱"
      class="w-full h-auto"
      loading="eager"
      fetchpriority="high"
      decoding="async"
    />
  </section>

  <!-- Products Section -->
  <section class="py-20" data-aos="fade-up" aria-labelledby="winstar-title">
    <div class="container mx-auto px-6">
      <div class="text-center mb-12">
        <h2 id="winstar-title" class="text-4xl font-bold text-gray-800">
          哪款配方最适合你的猫？
        </h2>
        <p class="text-gray-500 mt-2">
          为你的毛孩子挑一款好吃又营养的配方。
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-x-10 gap-y-24 mt-16">
        <!-- Card 1: Seafood -->
        <article class="product-card-v2 bg-pastel-blue" data-aos="zoom-in-up" data-aos-delay="100" itemscope itemtype="https://schema.org/Product">
          <meta itemprop="brand" content="WinStar" />
          <img
            src="/img/Winstar/Winstar1.png"
            alt="WinStar 猫粮 — 海鲜口味"
            class="product-image-v2 aspect-square object-contain"
            loading="lazy"
            decoding="async"
            width="600" height="600"
            itemprop="image"
          />
          <h3 class="text-2xl font-bold text-gray-800 mt-8" itemprop="name">
            WinStar – 海鲜口味
          </h3>
          <p class="text-gray-600 mt-2 mb-6 h-12" itemprop="description">
            海味香醇，富含蛋白质。
          </p>
          <a href="/product/winstar-seafood" class="add-to-cart-btn" aria-label="将 WinStar 海鲜口味加入购物车" itemprop="url">
            加入购物车
          </a>
        </article>

        <!-- Card 2: Tuna -->
        <article class="product-card-v2 bg-pastel-pink" data-aos="zoom-in-up" data-aos-delay="200" itemscope itemtype="https://schema.org/Product">
          <meta itemprop="brand" content="WinStar" />
          <img
            src="/img/Winstar/Winstar2.png"
            alt="WinStar 猫粮 — 金枪鱼口味"
            class="product-image-v2 aspect-square object-contain"
            loading="lazy"
            decoding="async"
            width="600" height="600"
            itemprop="image"
          />
          <h3 class="text-2xl font-bold text-gray-800 mt-8" itemprop="name">
            WinStar – 金枪鱼口味
          </h3>
          <p class="text-gray-600 mt-2 mb-6 h-12" itemprop="description">
            富含金枪鱼，助力强健体魄。
          </p>
          <a href="/product/winstar-tuna" class="add-to-cart-btn" aria-label="将 WinStar 金枪鱼口味加入购物车" itemprop="url">
            加入购物车
          </a>
        </article>

        <!-- Card 3: Salmon -->
        <article class="product-card-v2 bg-pastel-peach" data-aos="zoom-in-up" data-aos-delay="300" itemscope itemtype="https://schema.org/Product">
          <meta itemprop="brand" content="WinStar" />
          <img
            src="/img/Winstar/ws-salmon-01-300x300.png"
            alt="WinStar 猫粮 — 三文鱼口味"
            class="product-image-v2 aspect-square object-contain"
            loading="lazy"
            decoding="async"
            width="600" height="600"
            itemprop="image"
          />
          <h3 class="text-2xl font-bold text-gray-800 mt-8" itemprop="name">
            WinStar – 三文鱼口味
          </h3>
          <p class="text-gray-600 mt-2 mb-6 h-12" itemprop="description">
            富含 Omega-3，帮助毛发亮泽。
          </p>
          <a href="/product/winstar-salmon" class="add-to-cart-btn" aria-label="将 WinStar 三文鱼口味加入购物车" itemprop="url">
            加入购物车
          </a>
        </article>
      </div>
    </div>
  </section>
</main>


  <div id="footer-placeholder"></div>

  <!-- ✅ AOS Script -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 1000, once: true, offset: 120 });
  </script>
</body>
</html>
